<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1180 740">
<title>Solver–Challenger 二染色内外循环</title>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#5b718e"/></marker></defs>
<rect width="1180" height="740" fill="#f5f7fc"/>
<g font-family="sans-serif" fill="#172942"><text x="50" y="53" font-size="27" font-weight="bold">Solver–Challenger · 可验证交互循环</text><text x="50" y="84" font-size="16">冻结模型 API / 显式离线替身 · 任务与奖励由程序验证 · 训练分支尚未接入</text></g>
<rect x="370" y="115" width="750" height="285" rx="18" fill="#e8f2ff" stroke="#a5bfdc"/>
<text x="395" y="148" font-family="sans-serif" font-size="18" fill="#245b91">内循环：一道题的多步求解（每题重复采样）</text>
<g fill="white" stroke="#9aadc5" stroke-width="1.5"><rect x="50" y="185" width="245" height="110" rx="12"/><rect x="410" y="185" width="255" height="110" rx="12"/><rect x="820" y="185" width="255" height="110" rx="12"/><rect x="820" y="465" width="255" height="110" rx="12"/><rect x="410" y="465" width="255" height="110" rx="12"/><rect x="50" y="465" width="245" height="110" rx="12"/><rect x="820" y="630" width="255" height="75" rx="12" stroke-dasharray="6 5"/></g>
<g font-family="sans-serif" text-anchor="middle" fill="#172942"><g font-size="20" font-weight="bold"><text x="172" y="218">任务生成与穷举核验</text><text x="537" y="218">Solver</text><text x="947" y="218">环境 + 精确验证器</text><text x="947" y="498">轨迹、奖励与分组统计</text><text x="537" y="498">Challenger</text><text x="172" y="498">提案校验与配对调度</text><text x="947" y="660">训练入口 · 仅数据导出</text></g><g font-size="15"><text x="172" y="249">初轮种子 / 后续 family、size</text><text x="172" y="274">可解性 · 最短步数 · 预算</text><text x="537" y="249">图 + 当前状态 + 历史 + 预算</text><text x="537" y="274">每次返回一个翻转节点</text><text x="947" y="249">执行动作，返回新状态与分数</text><text x="947" y="274">r = 分差 + 首次完成加成</text><text x="947" y="530">目标失败率 → 挑战分</text><text x="947" y="553">目标与对照撤销率差 → 诊断分</text><text x="537" y="530">已完成批次的轨迹与奖励反馈</text><text x="537" y="553">假设 + 预测 + 题型 + 证据 ID</text><text x="172" y="530">真实引用 · 题型与规模范围</text><text x="172" y="553">目标 × 2 · 对照 × 1 · 可选重测</text><text x="947" y="688">预留本地 rollout / 优化器接入</text></g></g>
<g fill="none" stroke="#5b718e" stroke-width="2.5" marker-end="url(#arrow)"><path d="M295 240 H410"/><path d="M665 230 H820"/><path d="M947 295 V350 H537 V295"/><path d="M1075 270 H1100 V430 H947 V465"/><path d="M820 520 H665"/><path d="M410 520 H295"/><path d="M172 465 V295"/><path d="M947 575 V630" stroke-dasharray="6 5"/></g>
<g font-family="sans-serif" font-size="15" fill="#425e7d"><text x="319" y="227">出题</text><text x="706" y="217">动作</text><text x="660" y="340">状态与即时反馈</text><text x="962" y="434">回合结束</text><text x="701" y="507">可见反馈</text><text x="320" y="507">提案</text><text x="185" y="365">同步 / 一批预取</text><text x="185" y="389">按决策 ID 归属</text><text x="50" y="645" font-size="19" font-weight="bold">外循环更新的是任务分布，当前不更新模型参数。</text><text x="50" y="678">重测沿用原图，单列成功率。训练入口导出两个角色的环境转移。</text></g>
</svg>
